<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora - AI Chatbot & Image Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2b2b40;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #3f3f5f;
        }
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #4a4ae2;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #3b3b54;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .ai-message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
        .input-container {
            display: flex;
            padding: 15px;
            background-color: #2b2b40;
            border-top: 1px solid #3f3f5f;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a4ae2;
            background-color: #1e1e2f;
            color: white;
            font-size: 16px;
        }
        select {
            padding: 10px;
            border-radius: 8px;
            background-color: #1e1e2f;
            color: white;
            border: 1px solid #4a4ae2;
        }
        button {
            padding: 10px 20px;
            background-color: #4a4ae2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #3b3bfc;
        }
    </style>
</head>
<body>

    <header>🤖 Aurora - AI Assistant & Image Creator</header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">হ্যালো! আমি Aurora, আপনার এআই সহকারী। আপনি আমার সাথে চ্যাট করতে পারেন অথবা ছবি তৈরি করার কমান্ড দিতে পারেন। নিচে মোড সিলেক্ট করে লিখে পাঠান!</div>
    </div>

    <div class="input-container">
        <select id="modeSelect">
            <option value="chat">Chat (চ্যাট)</option>
            <option value="image">Image (ছবি জেনারেট)</option>
        </select>
        <input type="text" id="userInput" placeholder="আপনার প্রশ্ন বা ছবির আইডিয়া এখানে লিখুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6I_VffviulNG8PjWxNUHE5tfgcJDKO5QOkq5SBLWGr-aA";

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chatContainer");
            const mode = document.getElementById("modeSelect").value;
            const promptText = inputField.value.trim();

            if (!promptText) return;

            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user-message";
            userMsgDiv.textContent = promptText;
            chatContainer.appendChild(userMsgDiv);

            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiMsgDiv = document.createElement("div");
            aiMsgDiv.className = "message ai-message";
            aiMsgDiv.textContent = "দয়া করে অপেক্ষা করুন, এআই উত্তর তৈরি করছে...";
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (mode === "chat") {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }]
                        })
                    });
                    const data = await response.json();
                    const reply = data.candidates[0].content.parts[0].text;
                    aiMsgDiv.textContent = reply;
                } catch (error) {
                    aiMsgDiv.textContent = "দুঃখিত, কোনো সমস্যা হয়েছে। আবার চেষ্টা করুন।";
                }
            } else {
                aiMsgDiv.innerHTML = `আপনার জন্য ছবি তৈরি হচ্ছে...<br><img src="https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}" alt="Generated Image" onload="this.previousSibling.remove();">`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>
</html>
